rootProject.name = 'lxp-msa-workspace'

// 모노레포 구성: 각 하위 폴더는 자체 settings.gradle을 가진 독립 Gradle 빌드이며,
// includeBuild(Composite Build)로 하나의 워크스페이스에 묶어 함께 개발합니다.
includeBuild('gateway')
