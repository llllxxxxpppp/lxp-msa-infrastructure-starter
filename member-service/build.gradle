plugins {
    id 'java'
    id 'pmd'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.15'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'com.lcs'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', '2025.0.3')
    set('grpcVersion', '1.68.1')
    set('protobufVersion', '3.25.5')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // gRPC (member = 서버)
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

pmd {
    ignoreFailures = false
    toolVersion = '7.25.0'

    ruleSetFiles = files("$rootDir/config/pmd/rules.xml")
    ruleSets = []
}

tasks.withType(Pmd).configureEach {
    // protobuf-gradle-plugin이 build/generated/source/proto/main/{java,grpc}를 별도의
    // 소스 루트로 sourceSets.main.java에 추가하기 때문에, 각 소스 루트 기준 상대 경로에는
    // "generated" 세그먼트가 나타나지 않아 exclude '**/generated/**' 는 매칭되지 않는다(no-op).
    // 대신 proto의 java_package 옵션(com.lcs.grpc.member)과 일치하는 고정 패키지 경로로 제외한다.
    exclude '**/com/lcs/grpc/**'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'MEMBER_GRPC_PORT', '0'
    finalizedBy tasks.jacocoTestReport
}

tasks.withType(JacocoReport).configureEach {
    dependsOn tasks.test

    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }

    // PMD와 달리 JaCoCo는 컴파일된 .class 파일 기준으로 대상을 필터링한다.
    // proto의 java_package 옵션(com.lcs.grpc.member)과 일치하는 생성 코드
    // (MemberSuspensionServiceGrpc, SuspensionStatusRequest/Response, MemberSuspensionProto 등)를
    // 커버리지 계산 대상에서 제외한다.
    classDirectories.setFrom(
        files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['com/lcs/grpc/**'])
        })
    )
}
