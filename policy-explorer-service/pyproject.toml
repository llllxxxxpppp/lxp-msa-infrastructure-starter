[project]
name = "policy-explorer-service"
version = "0.1.0"
description = "사내 규정 개정안이 기존 문서와 충돌하는지 로컬 LLM으로 검출하는 백오피스 서비스"
readme = "README.md"
requires-python = ">=3.12"

# 런타임 필수 의존성. 컨테이너 이미지에 들어가는 것은 이 목록뿐이다.
#
# 🚨 PoC 리포(policy-explorer-service)의 pyproject.toml에서 달라진 점
#   - 제거: sentence-transformers, langchain-huggingface
#           임베딩을 Ollama(bge-m3)에 맡기면서 torch 스택이 불필요해졌다.
#   - 이동: vllm, bitsandbytes, langchain-openai -> [project.optional-dependencies].vllm
#           이 서비스는 Ollama만 쓴다. 특히 vllm은 linux/arm64 휠이 없어 필수 의존성으로
#           두면 이미지 빌드 자체가 실패한다.
#   - 추가: python-multipart, langchain-classic, langchain-text-splitters
#           코드가 직접 import하는데 선언이 없어 전이 의존에 기대고 있었다.
dependencies = [
    # API 서버
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",   # UploadFile(멀티파트 업로드)이 요구
    # LangChain / LangGraph
    "langchain>=1.3.15",
    "langchain-core>=1.5.4",
    "langchain-chroma>=1.1.0",     # Chroma 벡터 스토어(전용 독립 패키지)
    "langchain-community>=0.4.2",  # PyPDFLoader, Docx2txtLoader, BM25Retriever
    "langchain-classic>=1.0.8",    # EnsembleRetriever
    "langchain-ollama>=1.1.0",     # ChatOllama, OllamaEmbeddings
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    # 검색 / 저장
    "chromadb>=1.5.9",
    "rank-bm25>=0.2.2",
    # 문서 파싱
    "pypdf>=6.16.1",
    "docx2txt>=0.9",
]

# vLLM 엔진으로 벤치마크할 때만 설치한다: uv sync --extra vllm
# (PoC 리포의 lxp-vllm-*.py를 이 폴더로 가져올 경우에 필요. 현재 이식 대상 아님)
[project.optional-dependencies]
vllm = [
    "vllm>=0.22.1",
    "bitsandbytes>=0.50.0",
    "langchain-openai>=1.4.3",
]

# 개발/테스트 전용. Dockerfile은 `uv sync --no-dev`로 설치를 건너뛴다.
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
