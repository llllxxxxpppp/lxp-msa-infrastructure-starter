// gRPC 서버/클라이언트 공통 설정. proto 컴파일과 stub 생성까지 포함한다.
// protobuf-gradle-plugin 버전은 buildLogic/libs.versions.toml이 관리한다.
plugins {
    id 'buildlogic.java-spring-boot-conventions'

    id 'com.google.protobuf'
}

def grpcVersion = '1.68.1'
def protobufVersion = '3.25.5'

dependencyManagement {
    imports {
        mavenBom "io.grpc:grpc-bom:${grpcVersion}"
    }
}

dependencies {
    implementation 'io.grpc:grpc-netty-shaded'
    implementation 'io.grpc:grpc-protobuf'
    implementation 'io.grpc:grpc-stub'

    // 생성된 stub이 참조하는 @Generated. 런타임에는 필요하지 않다.
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}
