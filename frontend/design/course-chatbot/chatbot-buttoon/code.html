<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>EduSphere LXP - AI Chatbot Interface</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed": "#001848",
              "surface-dim": "#d7dadc",
              "tertiary-fixed": "#feddb5",
              "on-primary-fixed-variant": "#38485a",
              "error-container": "#ffdad6",
              "tertiary-fixed-dim": "#e1c29b",
              "on-tertiary": "#ffffff",
              "warning-amber": "#F59E0B",
              "tertiary-container": "#38260b",
              "surface-container-lowest": "#ffffff",
              "on-background": "#181c1e",
              "surface-tint": "#4f6073",
              "surface-bright": "#f7fafc",
              "on-secondary": "#ffffff",
              secondary: "#0453cd",
              "on-surface": "#181c1e",
              surface: "#f7fafc",
              "surface-container-highest": "#e0e3e5",
              "slate-text": "#4A5568",
              tertiary: "#211200",
              "on-error-container": "#93000a",
              "secondary-fixed-dim": "#b2c5ff",
              "on-tertiary-container": "#a88c69",
              "inverse-surface": "#2d3133",
              "surface-container-low": "#f1f4f6",
              "inverse-on-surface": "#eef1f3",
              "outline-variant": "#c4c6cd",
              "secondary-container": "#356ee7",
              "on-secondary-fixed-variant": "#0040a2",
              "success-green": "#22C55E",
              "surface-container-high": "#e5e9eb",
              "on-error": "#ffffff",
              "primary-fixed": "#d2e4fb",
              background: "#f7fafc",
              "on-primary-fixed": "#0b1d2d",
              "on-secondary-container": "#fefcff",
              "surface-container": "#ebeef0",
              "on-primary": "#ffffff",
              primary: "#041627",
              "on-tertiary-fixed-variant": "#584326",
              "inverse-primary": "#b7c8de",
              "surface-variant": "#e0e3e5",
              "primary-fixed-dim": "#b7c8de",
              "secondary-fixed": "#dae2ff",
              "primary-container": "#1a2b3c",
              outline: "#74777d",
              "error-red": "#EF4444",
              error: "#ba1a1a",
              "on-tertiary-fixed": "#281802",
              "on-primary-container": "#8192a7",
              "on-surface-variant": "#44474c",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
              "2xl": "1rem",
              "3xl": "1.5rem",
            },
            spacing: {
              "stack-lg": "32px",
              base: "4px",
              "margin-desktop": "32px",
              "stack-sm": "8px",
              "margin-mobile": "16px",
              "container-max": "1280px",
              gutter: "24px",
              "stack-md": "16px",
            },
            fontFamily: {
              "headline-lg": ["Inter"],
              "body-lg": ["Inter"],
              "label-sm": ["Inter"],
              "body-md": ["Inter"],
              "headline-sm": ["Inter"],
              "body-sm": ["Inter"],
              "label-md": ["Inter"],
              "headline-md": ["Inter"],
              "headline-lg-mobile": ["Inter"],
            },
            fontSize: {
              "headline-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "body-lg": [
                "18px",
                {
                  lineHeight: "28px",
                  fontWeight: "400",
                },
              ],
              "label-sm": [
                "12px",
                {

                  letterSpacing: "0.02em",

                },
              ],
              "body-md": [
                "16px",
                {
                  lineHeight: "24px",

                },
              ],
              "headline-sm": [
                "20px",
                {
                  lineHeight: "28px",
                  fontWeight: "600",
                },
              ],
              "body-sm": [
                "14px",
                {
                  lineHeight: "20px",
                  fontWeight: "400",
                },
              ],
              "label-md": [
                "14px",
                {
                  lineHeight: "20px",
                  letterSpacing: "0.01em",
                  fontWeight: "600",
                },
              ],
              "headline-md": [
                "24px",
                {
                  lineHeight: "32px",
                  fontWeight: "600",
                },
              ],
              "headline-lg-mobile": [
                "24px",
                {
                  lineHeight: "32px",
                  fontWeight: "700",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }

      .chat-window {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        transform-origin: bottom right;
      }

      .chat-hidden {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
        pointer-events: none;
      }

      .chat-visible {
        opacity: 1;
        transform: scale(1) translateY(0);
        pointer-events: auto;
      }
    </style>
  </head>
  <body class="bg-background text-on-background font-body-md relative min-h-screen overflow-hidden">
    <!-- Dashboard Overlay Context -->
    <div class="pointer-events-none absolute inset-0 flex justify-center px-10 pt-20">
      <div
        class="bg-surface-container-lowest border-primary-fixed w-full max-w-4xl rounded-2xl border p-10 shadow-sm"
      >
        <h2 class="text-secondary mb-4 text-2xl font-bold">강의 자료 관리</h2>
        <p class="text-on-surface mb-4">담당 강좌가 없습니다.</p>
        <p class="text-secondary opacity-80">담당 강좌를 불러오지 못했습니다.</p>
      </div>
    </div>
    <!-- Main Application Canvas -->
    <main
      class="pointer-events-none relative z-10 flex h-full w-full flex-col items-center justify-center"
    ></main>
    <!-- Chatbot Floating Action Button -->
    <button
      aria-label="Open AI Assistant"
      class="bottom-margin-desktop right-margin-desktop bg-surface-container-lowest text-primary border-outline-variant hover:bg-surface-container-low pointer-events-auto fixed z-50 flex h-[72px] w-[72px] transform flex-col items-center justify-center rounded-2xl border shadow-lg transition-all duration-300 hover:scale-105 active:scale-95"
      id="chatBubble"
    >
      <img
        alt="Chatbot Icon"
        class="mb-1 h-8 w-8 object-contain"
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJGGRuG-FrdYZ5UmPiblq5sfQfqMJHMw65_WOmvLV2IoYkzqCva2q-4HmijQA5L6CU9vz_ao3pUXUOGK6uAdljaGKxzfUaCwVcIEiv8Ia3bIFN2Ji_Pj3zIs6ff2RMfUnDXPjkp_Ih0v3QsLp6sx0VLif1VnP0fk0xQWmoDhheboATR7wMr3DQGUuzYlG4FI7-ycCK3FVzGUHz54BNH_1hP5HStclmYqDWiG69mdvfH_UyH4sBy2IDOC5Q-blsOW6rUts"
      />
      <span class="font-label-sm text-[11px] font-bold">Chatbot</span>
    </button>
    <!-- Chatbot Window -->
    <div
      class="chat-window chat-hidden bg-surface-container-lowest pointer-events-auto fixed right-8 bottom-8 z-50 flex h-[600px] max-h-[85vh] w-[380px] flex-col overflow-hidden rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.12)]"
      id="chatWindow"
    >
      <!-- Chat Header -->
      <div
        class="bg-primary-fixed text-primary flex shrink-0 items-start justify-between rounded-t-3xl p-6"
      >
        <div>
          <h3 class="font-headline-sm text-headline-sm mb-1 font-bold text-[#0f3b5a]">
            AI 학습 도우미
          </h3>
          <p class="font-body-sm text-body-sm text-[#3b6382]">강의 자료에 대해 질문해 보세요.</p>
        </div>
        <button
          aria-label="Close Chat"
          class="mt-1 text-[#0f3b5a] transition-opacity hover:opacity-70"
          id="closeChat"
        >
          <span class="material-symbols-outlined text-[20px] font-bold">close</span>
        </button>
      </div>
      <!-- Chat Area -->
      <div
        class="bg-surface-container-lowest relative flex flex-1 flex-col overflow-y-auto p-6"
        id="chatMessages"
      >
        <!-- Dropdown selector -->
        <div
          class="border-outline-variant bg-surface-container-lowest mb-auto flex w-full cursor-pointer items-center justify-between rounded-lg border px-4 py-3"
        >
          <span class="text-on-surface-variant font-body-sm"></span>
          <span class="material-symbols-outlined text-outline">expand_more</span>
        </div>
        <!-- Empty State Text -->
        <div class="pointer-events-none absolute inset-0 mt-10 flex items-center justify-center">
          <p class="text-slate-text font-body-sm">궁금한 내용을 입력해 주세요.</p>
        </div>
      </div>
      <!-- Input Area -->
      <div class="bg-surface-container-lowest border-surface-container shrink-0 border-t p-4">
        <div class="flex items-center gap-2">
          <input
            class="bg-surface-container-lowest border-outline-variant focus:ring-primary-fixed focus:border-primary-fixed font-body-sm text-body-sm text-on-surface placeholder:text-slate-text flex-1 rounded-xl border px-4 py-3 outline-none focus:ring-1"
            placeholder="질문을 입력하세요."
            type="text"
          />
          <button
            class="bg-primary-fixed text-primary font-label-md hover:bg-primary-fixed-dim rounded-xl px-5 py-3 whitespace-nowrap transition-colors"
          >
            전송
          </button>
        </div>
      </div>
    </div>
    <script>
      const chatBubble = document.getElementById("chatBubble");
      const chatWindow = document.getElementById("chatWindow");
      const closeChat = document.getElementById("closeChat");

      let isOpen = false; // Set to false by default

      function toggleChat() {
        isOpen = !isOpen;
        if (isOpen) {
          chatWindow.classList.remove("chat-hidden");
          chatWindow.classList.add("chat-visible");
          chatBubble.classList.add("scale-0", "opacity-0", "pointer-events-none"); // Hide bubble when open
        } else {
          chatWindow.classList.remove("chat-visible");
          chatWindow.classList.add("chat-hidden");
          chatBubble.classList.remove("scale-0", "opacity-0", "pointer-events-none"); // Show bubble when closed
        }
      }

      chatBubble.addEventListener("click", toggleChat);
      closeChat.addEventListener("click", toggleChat);

      // Initialize state
      if (isOpen) {
        chatWindow.classList.remove("chat-hidden");
        chatWindow.classList.add("chat-visible");
        chatBubble.classList.add("scale-0", "opacity-0", "pointer-events-none");
      } else {
        chatWindow.classList.remove("chat-visible");
        chatWindow.classList.add("chat-hidden");
        chatBubble.classList.remove("scale-0", "opacity-0", "pointer-events-none");
      }
    </script>
  </body>
</html>
