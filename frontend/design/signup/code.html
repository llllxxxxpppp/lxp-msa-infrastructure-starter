<html class="h-full" lang="en">
  <head>
    <meta charset="utf-8" />

              "surface-container": "#ebeef0",
              "on-primary": "#ffffff",
              primary: "#041627",
              "on-tertiary-fixed-variant": "#584326",
              "inverse-primary": "#b7c8de",
              "surface-variant": "#e0e3e5",
              "primary-fixed-dim": "#b7c8de",
              "secondary-fixed": "#dae2ff",
              "primary-container": "#1a2b3c",
              outline: "#74777d",
              "error-red": "#EF4444",
              error: "#ba1a1a",
              "on-tertiary-fixed": "#281802",
              "on-primary-container": "#8192a7",
              "on-surface-variant": "#44474c",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              "stack-lg": "32px",
              base: "4px",
              "margin-desktop": "32px",
              "stack-sm": "8px",

              "container-max": "1280px",
              gutter: "24px",

            },
            fontFamily: {

    <style>
      .input-glow:focus {
        box-shadow: 0 0 0 2px rgba(4, 83, 205, 0.2);
        border-color: #0453cd;
      }
    </style>
  </head>
  <body
    class="bg-primary font-body-md text-body-md text-on-surface relative flex min-h-screen items-center justify-center overflow-hidden antialiased"
  >
    <!-- Main Content Canvas -->
    <div class="bg-pattern pointer-events-none absolute inset-0 opacity-50"></div>
    <div
      class="mx-margin-mobile bg-surface-container-lowest card-shadow border-outline-variant p-stack-lg gap-stack-lg relative z-10 flex w-full max-w-[420px] flex-col rounded-xl border md:mx-0"
    >
      <div class="gap-stack-sm flex flex-col items-center text-center">
        <div
          class="bg-surface-container border-outline-variant mb-2 flex h-16 w-16 items-center justify-center overflow-hidden rounded-lg border"
        >
          <img
            class="h-full w-full object-cover"
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuDj6HHfa7_NwCd_MQw9PChy0pJTq7SohdpqMXgbTYehRUKgUtIJeA_bUiIQktviEL6RM7GdZjGEMPohJbUP--d3vrd01ueZzbqhRlaZYPwiEZW4F4gVdgHkRgzWhJyTl5_NGgJ-8mNKpf-ttnHVS69_qVkKWoUYA5poeDjTPw6OnVyi_QNsyE0abxOk0xQFgjX13wy_4VnQHrCC_ApVlj_V-_quX7twU4jgtU3U59dAkwiGd-RQK0FuiA"
          />
        </div>
        <h1 class="font-headline-sm text-headline-sm text-primary m-0">Create Account</h1>
        <p class="font-body-sm text-body-sm text-slate-text m-0">
          Join EduSphere LXP to start your learning journey.
        </p>
      </div>
      <form class="gap-stack-md flex flex-col" onsubmit="event.preventDefault()">
        <div class="gap-base flex flex-col">
          <label class="font-label-md text-label-md text-primary" for="email">Email Address</label>
          <div class="relative">
            <span
              class="material-symbols-outlined text-slate-text absolute top-1/2 left-3 -translate-y-1/2 text-[20px]"
              >mail</span
            ><input
              class="bg-surface-container-lowest border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder-slate-text/70 focus:border-secondary input-glow w-full border py-2 pr-4 pl-10 transition-all duration-200 focus:outline-none"
              id="email"
              placeholder="name@company.com"
              required=""
              type="email"
            />
          </div>
        </div>
        <div class="gap-base flex flex-col">
          <label class="font-label-md text-label-md text-primary" for="password">Password</label>
          <div class="relative">
            <span
              class="material-symbols-outlined text-slate-text absolute top-1/2 left-3 -translate-y-1/2 text-[20px]"
              >lock</span
            ><input
              class="bg-surface-container-lowest border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder-slate-text/70 focus:border-secondary input-glow w-full border py-2 pr-10 pl-10 transition-all duration-200 focus:outline-none"
              id="password"
              placeholder="••••••••"
              required=""
              type="password"
            /><button
              aria-label="Toggle password visibility"
              class="text-slate-text hover:text-primary absolute top-1/2 right-3 -translate-y-1/2 transition-colors focus:outline-none"
              type="button"
            >
              <span class="material-symbols-outlined text-[20px]">visibility</span>
            </button>
          </div>
        </div>
        <button
          class="bg-secondary text-on-secondary font-label-md text-label-md hover:bg-secondary-container mt-2 flex w-full items-center justify-center gap-2 rounded-lg px-4 py-2.5 shadow-sm transition-colors duration-200"
          type="submit"
        >
          Create Account<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
        </button>
      </form>
      <div class="pt-stack-sm border-outline-variant mt-2 border-t text-center">
        <p class="font-body-sm text-body-sm text-slate-text m-0">
          Already have an account?
          <a
            class="font-label-md text-label-md text-secondary transition-colors duration-200 hover:underline"
            href="#"
            >Log in</a
          >
        </p>
      </div>
    </div>
  </body>
</html>
