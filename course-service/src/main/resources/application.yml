spring:
  application:
    name: course-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:h2:mem:coursedb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        instance-id: ${spring.application.name}-${random.value}
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  file:
    name: ${LOG_DIR:../infrastructure/logs}/${spring.application.name}.log

course:
  instructor-status:
    # stub(기본, member 없이 단독) | rest(REST 호출) | grpc(gRPC 호출)
    mode: ${INSTRUCTOR_STATUS_MODE:rest}

member:
  grpc:
    host: ${MEMBER_GRPC_HOST:localhost}
    port: ${MEMBER_GRPC_PORT:9090}
