spring:
  application:
    name: course-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:h2:mem:coursedb
    username: sa
    password:
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        instance-id: ${spring.application.name}-${random.value}
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s

server:
  port: ${SERVER_PORT:8083}

# management(actuator) 노출·health 설정은 config-repo/application.yml에서 중앙 관리한다.
# 서킷 브레이커 엔드포인트(circuitbreakers 등)도 그곳에 정의되어 있다.

logging:
  file:
    name: ${LOG_DIR:../infrastructure/logs}/${spring.application.name}.log

course:
  instructor-status:
    # stub(기본, member 없이 단독) | rest(REST 호출) | grpc(gRPC 호출)
    mode: ${INSTRUCTOR_STATUS_MODE:rest}

member:
  grpc:
    host: ${MEMBER_GRPC_HOST:localhost}
    port: ${MEMBER_GRPC_PORT:9090}
