plugins {
    id 'buildlogic.java-spring-boot-conventions'
    id 'buildlogic.java-spring-boot-observability-conventions'
    id 'buildlogic.java-spring-cloud-config-client-conventions'

    id 'com.google.protobuf' version '0.9.4'
}

group = 'com.lcs'
version = '0.0.1-SNAPSHOT'

ext {
    set('grpcVersion', '1.68.1')
    set('protobufVersion', '3.25.5')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // gRPC (course = 클라이언트)
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    // AOP (Resilience4j annotation 처리에 필요)
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Resilience4j (Circuit Breaker) - annotation 기반, 버전은 Spring Cloud BOM이 관리
    implementation 'io.github.resilience4j:resilience4j-spring-boot3'

    runtimeOnly 'com.h2database:h2'

    // AOP
    implementation 'org.springframework.boot:spring-boot-starter-aop'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}
