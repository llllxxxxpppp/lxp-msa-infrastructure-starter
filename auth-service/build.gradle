plugins {
    id 'buildlogic.java-spring-boot-conventions'
    id 'buildlogic.java-spring-boot-observability-conventions'
    id 'buildlogic.java-spring-cloud-config-client-conventions'
    id 'buildlogic.java-spring-boot-grpc-conventions'
    id 'buildlogic.java-spring-boot-web-conventions'
    id 'buildlogic.java-spring-boot-swagger-conventions'
}

group = 'com.lcs'
version = '0.0.1-SNAPSHOT'

dependencies {
    // AOP
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Resilience4j (Circuit Breaker) - annotation 기반, 버전은 Spring Cloud BOM이 관리
    implementation 'io.github.resilience4j:resilience4j-spring-boot3'

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // gRPC (버전은 grpc 컨벤션의 grpc-bom이 관리)
    testImplementation 'io.grpc:grpc-inprocess'
}

tasks.named('test') {
    // 컨텍스트 부팅 테스트용 더미 시크릿. 프로덕션은 JWT_SECRET 환경변수로 주입한다(기본값 없음).
    environment 'JWT_SECRET', '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
}
