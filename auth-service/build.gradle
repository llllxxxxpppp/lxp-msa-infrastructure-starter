plugins {
    id 'buildlogic.java-spring-boot-observability-conventions'
    id 'buildlogic.java-spring-cloud-config-client-conventions'
    id 'buildlogic.java-spring-boot-grpc-conventions'
    id 'buildlogic.java-spring-boot-web-conventions'
    id 'buildlogic.java-spring-boot-swagger-conventions'
    id 'buildlogic.java-spring-boot-jpa-conventions'
    id 'buildlogic.java-spring-boot-resilience-conventions'
    id 'buildlogic.java-spring-boot-jwt-conventions'
}

group = 'com.lcs'
version = '0.0.1-SNAPSHOT'

dependencies {
    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'

    // gRPC (버전은 grpc 컨벤션의 grpc-bom이 관리)
    testImplementation 'io.grpc:grpc-inprocess'

    // [추가] Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
}

tasks.named('test') {
    // 컨텍스트 부팅 테스트용 더미 시크릿. 프로덕션은 JWT_SECRET 환경변수로 주입한다(기본값 없음).
    environment 'JWT_SECRET', '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
}
