spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        instance-id: ${spring.application.name}-${random.value}
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:lxp-test
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  file:
    name: ${LOG_DIR:../infrastructure/logs}/${spring.application.name}.log

jwt:
  secret: ${JWT_SECRET:4d553a82c87c2a2e0b7000d63eb926f3ef75fd528977b9c956efcec692845953}
  access-token-validity-milliseconds: 3600000
  refresh-token-validity-milliseconds: 864000000
