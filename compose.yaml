services:

  consul-1:
    image: hashicorp/consul:1.18
    container_name: lxp-consul-1
    command: agent -server -ui -node=consul-1 -bootstrap-expect=3 -client=0.0.0.0 -retry-join=consul-2 -retry-join=consul-3
    ports:
      - "8500:8500"
    networks: [lxp-net]
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - consul-1-data:/consul/data

  consul-2:
    image: hashicorp/consul:1.18
    container_name: lxp-consul-2
    command: agent -server -node=consul-2 -bootstrap-expect=3 -client=0.0.0.0 -retry-join=consul-1 -retry-join=consul-3
    networks: [lxp-net]
    volumes:
      - consul-2-data:/consul/data

  consul-3:
    image: hashicorp/consul:1.18
    container_name: lxp-consul-3
    command: agent -server -node=consul-3 -bootstrap-expect=3 -client=0.0.0.0 -retry-join=consul-1 -retry-join=consul-2
    networks: [lxp-net]
    volumes:
      - consul-3-data:/consul/data


  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: lxp-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infrastructure/prometheus/prometheus-docker.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [lxp-net]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: lxp-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # 3000은 프론트엔드(frontend/) 개발 서버용으로 남겨둔다 (gateway CORS가 localhost:3000을 전제).
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks: [lxp-net]

  loki:
    image: grafana/loki:3.3.2
    container_name: lxp-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks: [lxp-net]

  alloy:
    image: grafana/alloy:latest
    container_name: lxp-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./infrastructure/logs:/var/log/lxp:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345"
    depends_on:
      - loki
    networks: [lxp-net]

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: lxp-zipkin
    ports:
      - "9411:9411"
    networks: [lxp-net]

  rabbitmq:
    image: rabbitmq:4-management
    container_name: lxp-rabbitmq
    command: /bin/bash -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [lxp-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama:
    image: ollama/ollama:0.32.9
    container_name: lxp-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks: [lxp-net]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama-model-init:
    image: ollama/ollama:0.32.9
    container_name: lxp-ollama-model-init
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull qwen3.5:4b &&
        ollama pull qwen3-embedding:0.6b
    depends_on:
      ollama:
        condition: service_healthy
    networks: [lxp-net]

  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    container_name: lxp-gateway
    environment:
      CONSUL_HOST: consul-1
      CONSUL_PORT: 8500
      LOG_DIR: /logs
      CONFIG_SERVER_URL: http://config-server:8888
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JWT_SECRET: ${JWT_SECRET}
      AI_BOT_HOST: ai-tutor-service
      AI_BOT_PORT: "8000"
      CURRICULUM_BOT_HOST: curriculum-service
      CURRICULUM_BOT_PORT: "8000"
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/logs:/logs
    depends_on:
      consul-1:
        condition: service_healthy
      config-server:
        condition: service_healthy
      ai-tutor-service:
        condition: service_healthy
    networks: [lxp-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  config-server:
    build:
      context: .
      dockerfile: ./config-server/Dockerfile
    container_name: lxp-config-server
    environment:
      CONSUL_HOST: consul-1
      CONSUL_PORT: 8500
      LOG_DIR: /logs
      CONFIG_SEARCH_LOCATIONS: file:/config-repo
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8888:8888"
    volumes:
      - ./infrastructure/logs:/logs
      - ./config-repo:/config-repo:ro
    depends_on:
      consul-1:
        condition: service_healthy
    networks: [lxp-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    container_name: lxp-auth-service
    environment:
      CONSUL_HOST: consul-1
      CONSUL_PORT: 8500
      LOG_DIR: /logs
      CONFIG_SERVER_URL: http://config-server:8888
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_MEMBER_CLIENT_MODE: grpc
    ports:
      - "8081:8081"
    volumes:
      - ./infrastructure/logs:/logs
    depends_on:
      consul-1:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks: [lxp-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  member-service:
    build:
      context: .
      dockerfile: ./member-service/Dockerfile
    container_name: lxp-member-service
    environment:
      CONSUL_HOST: consul-1
      CONSUL_PORT: 8500
      LOG_DIR: /logs
      CONFIG_SERVER_URL: http://config-server:8888
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8082:8082"
    volumes:
      - ./infrastructure/logs:/logs
    depends_on:
      consul-1:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [lxp-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  ai-tutor-service:
    build:
      context: .
      dockerfile: ./ai-tutor-service/Dockerfile
    container_name: lxp-ai-tutor-service

    environment:
      # [수정] 로컬 PC Ollama → Docker Ollama
      OLLAMA_BASE_URL: http://ollama:11434

      # [추가] Docker에서 사용하는 모델
      OLLAMA_CHAT_MODEL: qwen3.5:4b
      OLLAMA_EMBEDDING_MODEL: qwen3-embedding:0.6b

      COURSE_SERVICE_URL: http://course-service:8083

    # [추가] Ollama 모델 다운로드 완료 후 AI Tutor 실행
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully

    volumes:
      - ai-tutor-chroma-data:/app/data/chroma

    networks: [lxp-net]

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  course-service:
    build:
      context: .
      dockerfile: ./course-service/Dockerfile
    container_name: lxp-course-service
    environment:
      CONSUL_HOST: consul-1
      CONSUL_PORT: 8500
      LOG_DIR: /logs
      CONFIG_SERVER_URL: http://config-server:8888
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      RABBITMQ_HOST: rabbitmq
      MEMBER_GRPC_HOST: member-service
      INSTRUCTOR_STATUS_MODE: rest
    ports:
      - "8083:8083"
    volumes:
      - ./infrastructure/logs:/logs
    depends_on:
      consul-1:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [lxp-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  curriculum-service:
    build:
      context: ./curriculum-service
      dockerfile: Dockerfile
    container_name: lxp-curriculum-service
    environment:
      COURSE_SERVICE_BASE_URL: http://course-service:8083
      OLLAMA_BASE_URL: http://ollama:11434
      PROVIDER: ${PROVIDER:-http}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: admin
    depends_on:
      course-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    networks: [lxp-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  subscription-service:
    build:
      context: .
      dockerfile: ./subscription-service/Dockerfile
    container_name: lxp-subscription-service
    environment:
      CONSUL_HOST: consul-1
      CONSUL_PORT: 8500
      LOG_DIR: /logs
      CONFIG_SERVER_URL: http://config-server:8888
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: admin
    ports:
      - "8084:8084"
    volumes:
      - ./infrastructure/logs:/logs
    depends_on:
      consul-1:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [lxp-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s


  policy-explorer-service:
    build:
      context: .
      dockerfile: ./policy-explorer-service/Dockerfile
    container_name: lxp-policy-explorer-service
    environment:
      SERVICE_PORT: "8086"
      CONSUL_HOST: consul-1
      CONSUL_PORT: 8500
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      CHROMA_PERSIST_DIR: /data/state/chroma
      METADATA_DB_PATH: /data/state/documents.db
      UPLOAD_DIR: /data/uploads
    ports:
      - "8086:8086"
    volumes:
      - policy-explorer-state:/data/state
      - policy-explorer-uploads:/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      consul-1:
        condition: service_healthy
    networks: [lxp-net]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s


networks:
  lxp-net:
    name: lxp-net
    driver: bridge

volumes:
  consul-1-data:
  consul-2-data:
  consul-3-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  rabbitmq-data:
  policy-explorer-state:
  policy-explorer-uploads:
  ollama-data:
  ai-tutor-chroma-data:
