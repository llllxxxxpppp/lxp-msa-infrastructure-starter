plugins {
    id 'base'
}

tasks.register('buildAll') {
    group = 'lxp'
    description = 'Build every independent Spring Boot project in this workspace.'
    dependsOn(
        gradle.includedBuild('gateway').task(':build'),
        gradle.includedBuild('config-server').task(':build'),
        gradle.includedBuild('auth-service').task(':build'),
        gradle.includedBuild('member-service').task(':build'),
        gradle.includedBuild('course-service').task(':build'),
        gradle.includedBuild('subscription-service').task(':build'),
        gradle.includedBuild('payment-service').task(':build')
    )
}
