management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    baggage:
      correlation:
        fields: request-id,user-id
      remote-fields: request-id,user-id
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

spring:
  cloud:
    consul:
      discovery:
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s

logging:
  level:
    root: INFO
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "

# JWT 서명/검증 공유 비밀키. gateway(검증)와 auth-service(서명)가 반드시 동일한 값을 써야 하므로
# 공통 설정에 단일 출처로 둔다. 기본값을 두지 않아 JWT_SECRET 미설정 시 기동을 실패(fail-fast)시킨다.
jwt:
  secret: ${JWT_SECRET}
