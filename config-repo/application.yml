management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    baggage:
      correlation:
        fields: request-id,user-id
      remote-fields: request-id,user-id
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

spring:
  cloud:
    consul:
      discovery:
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s
        # critical(헬스체크 실패) 인스턴스를 로드밸런싱 후보에서 제외한다. 기본값(false)이면
        # 재시작으로 죽은 옛 인스턴스가 카탈로그에 남아있는 동안 그쪽으로도 요청이 가서
        # 간헐적 Connection refused를 유발한다.
        query-passing: true
        # critical 상태가 1분 넘게 유지되면 카탈로그에서 자동 제거한다.
        # Consul이 강제하는 최소값이 1분이라 그보다 작은 값은 무시된다. 값이 무시되면
        # consul agent 로그에 다음과 같은 경고만 남고 타이머는 등록되지 않는다:
        # "check has deregister interval below minimum: minimum_interval=1m0s"
        health-check-critical-timeout: 1m

logging:
  level:
    root: INFO
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "

# 서킷 브레이커 공통 설정. member-service를 동기 호출하는 auth(fail-fast)/course(fail-open)가
# 동일한 회로 파라미터를 공유한다. 실패 정책(fallback 유무)만 각 서비스 코드에서 분기한다.
# resilience4j 미탑재 서비스(gateway 등)는 이 블록을 무시한다.
resilience4j:
  circuitbreaker:
    instances:
      member-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        # 4xx(HttpClientErrorException)는 member 장애가 아니라 클라이언트/요청 문제이므로
        # 회로 실패로 집계하지 않는다(집계 제외, 예외는 그대로 전파). 예: 미존재 이메일 400,
        # 미존재 강사 404. 이로써 정상 member에 대한 오탐 OPEN을 방지한다.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

# JWT 서명/검증 공유 비밀키. gateway(검증)와 auth-service(서명)가 반드시 동일한 값을 써야 하므로
# 공통 설정에 단일 출처로 둔다. 기본값을 두지 않아 JWT_SECRET 미설정 시 기동을 실패(fail-fast)시킨다.
jwt:
  secret: ${JWT_SECRET}
